[settings]
# Comma-separated list of source directories containing photos/videos to process
source_dirs = H:\eddie\Photos\MobileBackup\iPad\2026

# Directory where output folders (sorted by date) will be written
target_dir = D:\camera_workspace\sync_to_google

# Ignore files with modification time (mtime) date before this date (format: YYYY-MM-DD).
# Leave empty to process all files.
ignore_before = 2026-04-12
